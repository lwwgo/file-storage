<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#495057"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#28a745"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6f42c1"/>
    </marker>
    <marker id="arrow-yellow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#d39e00"/>
    </marker>
  </defs>

  <!-- ===== Client layer (green dashed box) ===== -->
  <rect x="20" y="20" width="960" height="110" rx="10" fill="#f0fff4" stroke="#28a745" stroke-width="2.5" stroke-dasharray="8 5"/>
  <text x="40" y="46" font-size="16" font-weight="bold" fill="#155724">Client (CLI)</text>
  <rect x="60" y="60" width="280" height="58" rx="6" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="200" y="82" text-anchor="middle" fill="#155724"><tspan font-weight="bold">Write ops</tspan></text>
  <text x="200" y="102" text-anchor="middle" fill="#155724" font-size="16">put · mkdir · rm</text>
  <rect x="360" y="60" width="280" height="58" rx="6" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="500" y="82" text-anchor="middle" fill="#155724"><tspan font-weight="bold">Read ops</tspan></text>
  <text x="500" y="102" text-anchor="middle" fill="#155724" font-size="16">get · ls · stat</text>
  <rect x="660" y="60" width="280" height="58" rx="6" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="800" y="82" text-anchor="middle" fill="#155724"><tspan font-weight="bold">Admin ops</tspan></text>
  <text x="800" y="102" text-anchor="middle" fill="#155724" font-size="16">replicas · nodes · gc</text>

  <!-- ===== MDS layer (red dashed box) ===== -->
  <rect x="20" y="170" width="960" height="260" rx="10" fill="#fff5f5" stroke="#dc3545" stroke-width="2.5" stroke-dasharray="8 5"/>
  <text x="40" y="196" font-size="16" font-weight="bold" fill="#721c24">Metadata Server Cluster (3-node Raft)</text>
  <!-- Leader -->
  <rect x="380" y="210" width="240" height="55" rx="6" fill="#f8d7da" stroke="#dc3545" stroke-width="3"/>
  <text x="500" y="233" text-anchor="middle" fill="#721c24"><tspan font-weight="bold">MDS1 · Leader</tspan></text>
  <text x="500" y="252" text-anchor="middle" fill="#721c24" font-size="16">handles writes</text>
  <!-- Follower 1 -->
  <rect x="120" y="218" width="200" height="45" rx="6" fill="#cce5ff" stroke="#007bff" stroke-width="2"/>
  <text x="220" y="245" text-anchor="middle" fill="#004085" font-weight="bold">MDS2 · Follower</text>
  <!-- Follower 2 -->
  <rect x="680" y="218" width="200" height="45" rx="6" fill="#cce5ff" stroke="#007bff" stroke-width="2"/>
  <text x="780" y="245" text-anchor="middle" fill="#004085" font-weight="bold">MDS3 · Follower</text>
  <!-- Raft replication dashed arrows -->
  <line x1="420" y1="210" x2="260" y2="218" stroke="#6f42c1" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-purple)"/>
  <text x="340" y="200" text-anchor="middle" fill="#6f42c1" font-size="16">Raft log replication</text>
  <line x1="580" y1="210" x2="740" y2="218" stroke="#6f42c1" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-purple)"/>
  <!-- State machine -->
  <rect x="120" y="290" width="760" height="120" rx="6" fill="#e2d9f3" stroke="#6f42c1" stroke-width="2"/>
  <text x="500" y="313" text-anchor="middle" fill="#4a2d8a" font-weight="bold">Raft State Machine (local replica on every node)</text>
  <text x="500" y="340" text-anchor="middle" fill="#4a2d8a">📂 Directory tree: /docs/readme, /images/logo</text>
  <text x="500" y="365" text-anchor="middle" fill="#4a2d8a">🗺️ File → DataNode mapping</text>
  <text x="500" y="390" text-anchor="middle" fill="#4a2d8a">Multi-replica support (default 3)</text>

  <!-- ===== DataNode layer (yellow dashed box) ===== -->
  <rect x="20" y="470" width="960" height="140" rx="10" fill="#fffbe6" stroke="#ffc107" stroke-width="2.5" stroke-dasharray="8 5"/>
  <text x="40" y="496" font-size="16" font-weight="bold" fill="#856404">Data Nodes (horizontally scalable, :9101+)</text>
  <rect x="60" y="510" width="280" height="80" rx="6" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="200" y="538" text-anchor="middle" fill="#856404"><tspan font-weight="bold">DataNode1</tspan></text>
  <text x="200" y="562" text-anchor="middle" fill="#856404" font-size="16">/dn1/docs/...</text>
  <rect x="360" y="510" width="280" height="80" rx="6" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="500" y="538" text-anchor="middle" fill="#856404"><tspan font-weight="bold">DataNode2</tspan></text>
  <text x="500" y="562" text-anchor="middle" fill="#856404" font-size="16">/dn2/images/...</text>
  <rect x="660" y="510" width="280" height="80" rx="6" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="800" y="538" text-anchor="middle" fill="#856404"><tspan font-weight="bold">DataNode3</tspan></text>
  <text x="800" y="562" text-anchor="middle" fill="#856404" font-size="16">/dn3/...</text>

  <!-- ===== Cross-layer arrows ===== -->
  <!-- Client Write -> MDS Leader -->
  <line x1="200" y1="118" x2="440" y2="210" stroke="#28a745" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="280" y="160" fill="#28a745" font-size="16" font-weight="bold">Metadata RPC (writes)</text>
  <!-- Client Read -> MDS Leader -->
  <line x1="500" y1="118" x2="500" y2="210" stroke="#495057" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="515" y="165" fill="#495057" font-size="16">reads (any node)</text>
  <!-- Client Admin -> MDS Leader -->
  <line x1="800" y1="118" x2="560" y2="210" stroke="#495057" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <!-- MDS Leader -> DataNodes (Data RPC) -->
  <line x1="440" y1="265" x2="200" y2="510" stroke="#d39e00" stroke-width="2" marker-end="url(#arrow-yellow)"/>
  <line x1="500" y1="265" x2="500" y2="510" stroke="#d39e00" stroke-width="2" marker-end="url(#arrow-yellow)"/>
  <line x1="560" y1="265" x2="800" y2="510" stroke="#d39e00" stroke-width="2" marker-end="url(#arrow-yellow)"/>
  <text x="610" y="470" fill="#d39e00" font-size="16" font-weight="bold">Data RPC (parallel to all replicas)</text>
</svg>
